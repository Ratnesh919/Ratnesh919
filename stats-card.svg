<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="320">
  <defs>
    <!-- Deep Glass Background Gradient -->
    <linearGradient id="glassBgStats" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1424" stop-opacity="0.96" />
      <stop offset="50%" stop-color="#12182c" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0.97" />
    </linearGradient>

    <!-- Top Glare Sheen -->
    <linearGradient id="glassGlareStats" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.00" />
    </linearGradient>

    <!-- Realistic Specular Glass Border -->
    <linearGradient id="realisticBorderStats" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.35" />
      <stop offset="90%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25" />
    </linearGradient>

    <!-- Inner Bevel Inset Rim -->
    <linearGradient id="innerBevelStats" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.40" />
    </linearGradient>

    <!-- Progress Bars -->
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="barPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="barAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Realistic Depth & Shadow Filter -->
    <filter id="realisticDepthStats" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glassGlowStats" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b1" />
      <feGaussianBlur stdDeviation="16" result="b2" />
      <feMerge>
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes barGrowScale {
        0% { transform: scaleX(0); }
        100% { transform: scaleX(1); }
      }
      .bar-growth {
        transform-origin: left;
        animation: barGrowScale 1.6s ease-out forwards;
      }
    </style>
  </defs>

  <!-- Ambient Glow Orbs -->
  <circle cx="750" cy="70" r="150" fill="#00f2fe" opacity="0.10" filter="url(#glassGlowStats)" />
  <circle cx="120" cy="240" r="150" fill="#a855f7" opacity="0.10" filter="url(#glassGlowStats)" />

  <!-- Outer Glass Frame with Realistic Shadow & Multi-Layer Border -->
  <g filter="url(#realisticDepthStats)">
    <rect x="6" y="6" width="838" height="308" rx="20" fill="url(#glassBgStats)" />
    <rect x="6" y="6" width="838" height="308" rx="20" fill="url(#glassGlareStats)" />
    <!-- Realistic Outer Specular Border -->
    <rect x="6" y="6" width="838" height="308" rx="20" fill="none" stroke="url(#realisticBorderStats)" stroke-width="1.8" />
    <!-- Inner Bevel Inset Line -->
    <rect x="8" y="8" width="834" height="304" rx="18" fill="none" stroke="url(#innerBevelStats)" stroke-width="1" />
  </g>

  <!-- LEFT GLASS PANEL: Engineering Overview -->
  <g transform="translate(24, 24)">
    <rect width="386" height="272" rx="14" fill="rgba(18, 24, 38, 0.70)" stroke="rgba(255, 255, 255, 0.10)" stroke-width="1.2" />
    
    <!-- Panel Header -->
    <text x="18" y="32" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">
      ⚡ Engineering Overview
    </text>
    <rect x="290" y="16" width="78" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.45)" stroke-width="1" />
    <text x="329" y="31" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">
      ECE • 2026
    </text>
    <line x1="18" y1="46" x2="368" y2="46" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- 4 Frosted Metric Boxes with Specular Rim Borders -->
    <!-- Box 1 -->
    <g transform="translate(18, 58)">
      <rect width="168" height="74" rx="10" fill="rgba(13, 17, 28, 0.85)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="12" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Total Contributions</text>
      <text x="12" y="54" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">
        260+ <tspan fill="#38bdf8" font-size="11" font-weight="600">Commits</tspan>
      </text>
    </g>

    <!-- Box 2 -->
    <g transform="translate(200, 58)">
      <rect width="168" height="74" rx="10" fill="rgba(13, 17, 28, 0.85)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="12" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Research Focus</text>
      <text x="12" y="54" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800">
        V2X <tspan fill="#38bdf8" font-size="11" font-weight="600">Beamforming</tspan>
      </text>
    </g>

    <!-- Box 3 -->
    <g transform="translate(18, 144)">
      <rect width="168" height="74" rx="10" fill="rgba(13, 17, 28, 0.85)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="12" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Hardware &amp; IoT</text>
      <text x="12" y="54" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">
        Arduino <tspan fill="#34d399" font-size="11" font-weight="600">&amp; Telemetry</tspan>
      </text>
    </g>

    <!-- Box 4 -->
    <g transform="translate(200, 144)">
      <rect width="168" height="74" rx="10" fill="rgba(13, 17, 28, 0.85)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="12" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">AI Automation</text>
      <text x="12" y="54" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">
        LLMs <tspan fill="#c084fc" font-size="11" font-weight="600">&amp; n8n</tspan>
      </text>
    </g>

    <!-- Left Footer -->
    <circle cx="26" cy="245" r="3.5" fill="#10b981" />
    <text x="36" y="249" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Active Research &amp; Building</text>
    <text x="368" y="249" text-anchor="end" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">MAKAUT University</text>
  </g>

  <!-- RIGHT GLASS PANEL: Technical Competency -->
  <g transform="translate(440, 24)">
    <rect width="386" height="272" rx="14" fill="rgba(18, 24, 38, 0.70)" stroke="rgba(255, 255, 255, 0.10)" stroke-width="1.2" />
    
    <!-- Header -->
    <text x="18" y="32" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">
      🛠️ Technical Competency
    </text>
    <rect x="300" y="16" width="68" height="22" rx="11" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1" />
    <text x="334" y="31" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">
      Verified
    </text>
    <line x1="18" y1="46" x2="368" y2="46" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Skill 1 -->
    <g transform="translate(18, 62)">
      <text x="0" y="0" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Python, C, C++ &amp; Scripting</text>
      <text x="350" y="0" text-anchor="end" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">92%</text>
      <rect y="8" width="350" height="6" rx="3" fill="#1e293b" />
      <rect class="bar-growth" y="8" width="322" height="6" rx="3" fill="url(#barCyan)" />
    </g>

    <!-- Skill 2 -->
    <g transform="translate(18, 108)">
      <text x="0" y="0" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">AI Automation, APIs &amp; n8n</text>
      <text x="350" y="0" text-anchor="end" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">88%</text>
      <rect y="8" width="350" height="6" rx="3" fill="#1e293b" />
      <rect class="bar-growth" y="8" width="308" height="6" rx="3" fill="url(#barPurple)" />
    </g>

    <!-- Skill 3 -->
    <g transform="translate(18, 154)">
      <text x="0" y="0" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Networking, TCP/IP &amp; Protocols</text>
      <text x="350" y="0" text-anchor="end" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">85%</text>
      <rect y="8" width="350" height="6" rx="3" fill="#1e293b" />
      <rect class="bar-growth" y="8" width="297" height="6" rx="3" fill="url(#barGreen)" />
    </g>

    <!-- Skill 4 -->
    <g transform="translate(18, 200)">
      <text x="0" y="0" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Figma UI/UX &amp; Web Development</text>
      <text x="350" y="0" text-anchor="end" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">82%</text>
      <rect y="8" width="350" height="6" rx="3" fill="#1e293b" />
      <rect class="bar-growth" y="8" width="287" height="6" rx="3" fill="url(#barAmber)" />
    </g>

    <text x="18" y="249" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Systems Integration</text>
    <text x="368" y="249" text-anchor="end" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Open for Relocation</text>
  </g>
</svg>
