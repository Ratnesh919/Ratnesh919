<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="260">
  <defs>
    <!-- Deep Frosted Glass Surface Gradient -->
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1424" stop-opacity="0.96" />
      <stop offset="50%" stop-color="#12182c" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0.97" />
    </linearGradient>

    <!-- Top Specular Sheen (Glass Light Glare) -->
    <linearGradient id="glassGlare" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.00" />
    </linearGradient>

    <!-- Realistic Specular Glass Border (Light Angle Reflection) -->
    <linearGradient id="realisticBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.35" />
      <stop offset="90%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25" />
    </linearGradient>

    <!-- Inner Bevel Rim Light -->
    <linearGradient id="innerBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.40" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Realistic Depth & Shadow Filter -->
    <filter id="realisticDepth" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Ambient Glow Filter -->
    <filter id="glassGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b1" />
      <feGaussianBlur stdDeviation="16" result="b2" />
      <feMerge>
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes radarWave {
        0% { r: 4; opacity: 1; }
        100% { r: 13; opacity: 0; }
      }
      .radar-dot {
        animation: radarWave 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
    </style>
  </defs>

  <!-- Ambient Light Orbs behind Glass -->
  <circle cx="740" cy="30" r="170" fill="#00f2fe" opacity="0.12" filter="url(#glassGlow)" />
  <circle cx="90" cy="230" r="150" fill="#a855f7" opacity="0.12" filter="url(#glassGlow)" />
  <circle cx="430" cy="120" r="110" fill="#38bdf8" opacity="0.06" filter="url(#glassGlow)" />

  <!-- Base Card with Realistic Drop Shadow -->
  <g filter="url(#realisticDepth)">
    <!-- Base Frosted Surface -->
    <rect x="6" y="6" width="838" height="248" rx="20" fill="url(#glassBg)" />
    <!-- Glass Specular Glare -->
    <rect x="6" y="6" width="838" height="248" rx="20" fill="url(#glassGlare)" />
    
    <!-- Realistic Multi-Layer Specular Glass Border (Outer Stroke) -->
    <rect x="6" y="6" width="838" height="248" rx="20" fill="none" stroke="url(#realisticBorder)" stroke-width="1.8" />
    
    <!-- Inner Bevel Inset Line (Realistic Thickness) -->
    <rect x="8" y="8" width="834" height="244" rx="18" fill="none" stroke="url(#innerBevel)" stroke-width="1" />
  </g>

  <!-- TOP BAR: Glass Status Pill & Location -->
  <g transform="translate(36, 28)">
    <!-- Pill with Glass Border -->
    <rect width="294" height="32" rx="16" fill="rgba(16, 185, 129, 0.14)" stroke="rgba(52, 211, 153, 0.5)" stroke-width="1.2" />
    <circle cx="18" cy="16" r="4.5" fill="#10b981" />
    <circle class="radar-dot" cx="18" cy="16" r="4.5" fill="none" stroke="#10b981" stroke-width="1.5" />
    <text x="32" y="21" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">
      OPEN TO ROLES &amp; RESEARCH (ECE 2026)
    </text>
  </g>

  <text x="814" y="49" text-anchor="end" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
    📍 Kolkata, WB, India • MAKAUT University
  </text>

  <!-- CENTER IDENTITY: Full Name & Subtitle -->
  <g transform="translate(36, 116)">
    <text x="0" y="0" fill="url(#textShine)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Ratnesh Kumar Singh
    </text>

    <!-- Verified Glass Badge -->
    <g transform="translate(365, -24)" filter="url(#glassGlow)">
      <circle cx="12" cy="12" r="11" fill="#00f2fe" stroke="#ffffff" stroke-width="1.5" />
      <path d="M7 12l3.5 3.5 6.5-6.5" fill="none" stroke="#080c14" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Subtitle Line -->
    <text x="0" y="30" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">
      <tspan fill="#38bdf8" font-weight="700">Electronics &amp; Communication Engineer</tspan>
      <tspan fill="#64748b"> | </tspan>
      <tspan fill="#e2e8f0">AI Automation &amp; Agents</tspan>
      <tspan fill="#64748b"> | </tspan>
      <tspan fill="#e2e8f0">Networking &amp; IT Infrastructure</tspan>
    </text>
  </g>

  <!-- BOTTOM ROW: Glassmorphic Floating Pills with Specular Inset Borders -->
  <g transform="translate(36, 192)">
    <!-- Pill 1 -->
    <g>
      <rect x="0" y="0" width="180" height="34" rx="9" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.2" />
      <text x="14" y="21" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
        🛰️ V2X Smart Antenna
      </text>
    </g>

    <!-- Pill 2 -->
    <g>
      <rect x="192" y="0" width="170" height="34" rx="9" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(192, 132, 252, 0.45)" stroke-width="1.2" />
      <text x="206" y="21" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
        🤖 LLM Agents &amp; n8n
      </text>
    </g>

    <!-- Pill 3 -->
    <g>
      <rect x="374" y="0" width="195" height="34" rx="9" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(251, 191, 36, 0.45)" stroke-width="1.2" />
      <text x="388" y="21" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
        ⚡ IoT &amp; Hardware Telemetry
      </text>
    </g>

    <!-- Pill 4 -->
    <g>
      <rect x="581" y="0" width="197" height="34" rx="9" fill="rgba(244, 63, 94, 0.12)" stroke="rgba(251, 113, 133, 0.45)" stroke-width="1.2" />
      <text x="595" y="21" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
        🎨 Figma UI/UX &amp; Web
      </text>
    </g>
  </g>
</svg>
