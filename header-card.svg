<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="260">
  <defs>
    <!-- Deep Glass Background Surface -->
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.98" />
      <stop offset="50%" stop-color="#141e33" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#0b101e" stop-opacity="0.98" />
    </linearGradient>

    <!-- Top Glass Glare Sheen -->
    <linearGradient id="glassGlare" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.00" />
    </linearGradient>

    <!-- Prominent High-Contrast Specular Glass Border -->
    <linearGradient id="realisticBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="20%" stop-color="#00f2fe" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.30" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.70" />
      <stop offset="90%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.60" />
    </linearGradient>

    <!-- Inner Bevel Rim Light -->
    <linearGradient id="innerBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.60" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- 100% GitHub-Compatible Shadow Filter (SVG 1.1) -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="135%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur" />
      <feOffset in="blur" dx="0" dy="8" result="offsetBlur" />
      <feFlood flood-color="#000000" flood-opacity="0.8" result="shadowColor" />
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="dropShadow" />
      <feMerge>
        <feMergeNode in="dropShadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ambient Glow Filter -->
    <filter id="rimGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes radarWave {
        0% { r: 4; opacity: 1; }
        100% { r: 13; opacity: 0; }
      }
      .radar-dot {
        animation: radarWave 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
    </style>
  </defs>

  <!-- Ambient Light Orbs -->
  <circle cx="740" cy="30" r="160" fill="#00f2fe" opacity="0.14" filter="url(#rimGlow)" />
  <circle cx="90" cy="230" r="140" fill="#a855f7" opacity="0.14" filter="url(#rimGlow)" />

  <!-- Outer Glass Rim Glow (Creates the Realistic Glass Ambient Aura) -->
  <rect x="5" y="5" width="840" height="250" rx="20" fill="none" stroke="#00f2fe" stroke-width="4" opacity="0.22" filter="url(#rimGlow)" />

  <!-- Main Card Body with Realistic Drop Shadow -->
  <g filter="url(#cardShadow)">
    <!-- Frosted Glass Surface -->
    <rect x="6" y="6" width="838" height="248" rx="20" fill="url(#glassBg)" />
    <!-- Glass Glare Top Sheen -->
    <rect x="6" y="6" width="838" height="248" rx="20" fill="url(#glassGlare)" />
    
    <!-- Primary Realistic Specular Border (Visible & High Contrast) -->
    <rect x="6" y="6" width="838" height="248" rx="20" fill="none" stroke="url(#realisticBorder)" stroke-width="2.2" />
    
    <!-- Secondary Inset Glass Bevel -->
    <rect x="8" y="8" width="834" height="244" rx="18" fill="none" stroke="url(#innerBevel)" stroke-width="1.2" />
  </g>

  <!-- TOP BAR: Glass Status Pill & Location -->
  <g transform="translate(36, 28)">
    <rect width="294" height="32" rx="16" fill="rgba(16, 185, 129, 0.18)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="18" cy="16" r="4.5" fill="#10b981" />
    <circle class="radar-dot" cx="18" cy="16" r="4.5" fill="none" stroke="#10b981" stroke-width="1.8" />
    <text x="32" y="21" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">
      OPEN TO ROLES &amp; RESEARCH (ECE 2026)
    </text>
  </g>

  <text x="814" y="49" text-anchor="end" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
    📍 Kolkata, WB, India • MAKAUT University
  </text>

  <!-- CENTER IDENTITY: Full Name & Subtitle -->
  <g transform="translate(36, 116)">
    <text x="0" y="0" fill="url(#textShine)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Ratnesh Kumar Singh
    </text>

    <!-- Verified Glass Badge -->
    <g transform="translate(365, -24)">
      <circle cx="12" cy="12" r="11" fill="#00f2fe" stroke="#ffffff" stroke-width="1.8" />
      <path d="M7 12l3.5 3.5 6.5-6.5" fill="none" stroke="#080c14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Subtitle Line -->
    <text x="0" y="30" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">
      <tspan fill="#38bdf8" font-weight="700">Electronics &amp; Communication Engineer</tspan>
      <tspan fill="#64748b"> | </tspan>
      <tspan fill="#e2e8f0">AI Automation &amp; Agents</tspan>
      <tspan fill="#64748b"> | </tspan>
      <tspan fill="#e2e8f0">Networking &amp; IT Infrastructure</tspan>
    </text>
  </g>

  <!-- BOTTOM ROW: Glassmorphic Floating Pills with Crisp Borders -->
  <g transform="translate(36, 192)">
    <g>
      <rect x="0" y="0" width="180" height="34" rx="10" fill="rgba(0, 242, 254, 0.16)" stroke="#00f2fe" stroke-width="1.4" />
      <text x="14" y="21" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">
        🛰️ V2X Smart Antenna
      </text>
    </g>

    <g>
      <rect x="192" y="0" width="170" height="34" rx="10" fill="rgba(168, 85, 247, 0.16)" stroke="#c084fc" stroke-width="1.4" />
      <text x="206" y="21" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">
        🤖 LLM Agents &amp; n8n
      </text>
    </g>

    <g>
      <rect x="374" y="0" width="195" height="34" rx="10" fill="rgba(245, 158, 11, 0.16)" stroke="#fbbf24" stroke-width="1.4" />
      <text x="388" y="21" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">
        ⚡ IoT &amp; Hardware Telemetry
      </text>
    </g>

    <g>
      <rect x="581" y="0" width="197" height="34" rx="10" fill="rgba(244, 63, 94, 0.16)" stroke="#fb7185" stroke-width="1.4" />
      <text x="595" y="21" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">
        🎨 Figma UI/UX &amp; Web
      </text>
    </g>
  </g>
</svg>
