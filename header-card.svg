<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="260">
  <defs>
    <!-- Deep Frosted Glass Background Gradient -->
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c101b" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#111728" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glass Surface Highlight -->
    <linearGradient id="glassSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glassGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b1" />
      <feGaussianBlur stdDeviation="12" result="b2" />
      <feMerge>
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes radarWave {
        0% { r: 4; opacity: 1; }
        100% { r: 12; opacity: 0; }
      }
      .radar-dot {
        animation: radarWave 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
    </style>
  </defs>

  <!-- Ambient Glow Backdrops (Glassmorphism Lighting) -->
  <circle cx="720" cy="40" r="160" fill="#00f2fe" opacity="0.10" filter="url(#glassGlow)" />
  <circle cx="100" cy="220" r="140" fill="#a855f7" opacity="0.10" filter="url(#glassGlow)" />
  <circle cx="450" cy="130" r="100" fill="#f59e0b" opacity="0.05" filter="url(#glassGlow)" />

  <!-- Base Frosted Glass Card -->
  <rect x="4" y="4" width="842" height="252" rx="18" fill="url(#glassBg)" />
  <rect x="4" y="4" width="842" height="252" rx="18" fill="url(#glassSurface)" />

  <!-- Refined 1.5px Glassmorphic Border -->
  <rect x="4" y="4" width="842" height="252" rx="18" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" />

  <!-- TOP BAR: Glass Status Pill & Location -->
  <g transform="translate(36, 26)">
    <rect width="290" height="32" rx="16" fill="rgba(16, 185, 129, 0.14)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
    <circle cx="18" cy="16" r="4.5" fill="#10b981" />
    <circle class="radar-dot" cx="18" cy="16" r="4.5" fill="none" stroke="#10b981" stroke-width="1.5" />
    <text x="32" y="21" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">
      OPEN TO ROLES &amp; RESEARCH (ECE 2026)
    </text>
  </g>

  <text x="814" y="47" text-anchor="end" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
    📍 Kolkata, WB, India • MAKAUT University
  </text>

  <!-- CENTER IDENTITY: Full Name & Subtitle -->
  <g transform="translate(36, 114)">
    <text x="0" y="0" fill="url(#textShine)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Ratnesh Kumar Singh
    </text>

    <!-- Verified Badge -->
    <g transform="translate(365, -24)" filter="url(#glassGlow)">
      <circle cx="12" cy="12" r="10" fill="#00f2fe" />
      <path d="M7 12l3.5 3.5 6.5-6.5" fill="none" stroke="#080c14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Subtitle Line -->
    <text x="0" y="30" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">
      <tspan fill="#38bdf8" font-weight="700">Electronics &amp; Communication Engineer</tspan>
      <tspan fill="#64748b"> | </tspan>
      <tspan fill="#e2e8f0">AI Automation &amp; Agents</tspan>
      <tspan fill="#64748b"> | </tspan>
      <tspan fill="#e2e8f0">Networking &amp; IT Infrastructure</tspan>
    </text>
  </g>

  <!-- BOTTOM ROW: Glassmorphic Floating Pills -->
  <g transform="translate(36, 192)">
    <rect x="0" y="0" width="180" height="34" rx="8" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.35)" stroke-width="1" />
    <text x="14" y="21" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
      🛰️ V2X Smart Antenna
    </text>

    <rect x="192" y="0" width="170" height="34" rx="8" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1" />
    <text x="206" y="21" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
      🤖 LLM Agents &amp; n8n
    </text>

    <rect x="374" y="0" width="195" height="34" rx="8" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1" />
    <text x="388" y="21" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
      ⚡ IoT &amp; Hardware Telemetry
    </text>

    <rect x="581" y="0" width="197" height="34" rx="8" fill="rgba(244, 63, 94, 0.12)" stroke="rgba(244, 63, 94, 0.35)" stroke-width="1" />
    <text x="595" y="21" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
      🎨 Figma UI/UX &amp; Web
    </text>
  </g>
</svg>
