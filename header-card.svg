<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="260">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Neon Animated Border Gradients -->
    <linearGradient id="cyanGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="purpleGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Glowing Pill Gradients -->
    <linearGradient id="pillGradCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="pillGradPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="pillGradAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="pillGradRose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0.05" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(0, 242, 254, 0.04)" stroke-width="1" />
    </pattern>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes borderRun {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 2200; }
      }
      @keyframes borderRunReverse {
        0% { stroke-dashoffset: 2200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.65; }
        50% { opacity: 1; }
      }
      @keyframes radarPulse {
        0% { r: 4; opacity: 1; }
        100% { r: 11; opacity: 0; }
      }
      @keyframes orbFloat {
        0% { transform: translate(0, 0); }
        50% { transform: translate(-30px, 15px); }
        100% { transform: translate(0, 0); }
      }

      .animated-card-border-cyan {
        stroke-dasharray: 140 410;
        animation: borderRun 6.5s linear infinite;
      }
      .animated-card-border-purple {
        stroke-dasharray: 100 450;
        animation: borderRunReverse 8s linear infinite;
      }
      .pulse-indicator {
        animation: pulseLight 2s ease-in-out infinite;
      }
      .radar-ring {
        animation: radarPulse 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
      .ambient-orb {
        animation: orbFloat 10s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- 1. Background Card -->
  <rect x="4" y="4" width="842" height="252" rx="18" fill="url(#bgGrad)" />

  <!-- 2. Tech Grid Overlay -->
  <rect x="4" y="4" width="842" height="252" rx="18" fill="url(#techGrid)" />

  <!-- 3. Ambient Neon Lighting Blobs -->
  <circle class="ambient-orb" cx="720" cy="50" r="140" fill="#00f2fe" opacity="0.08" filter="url(#neonGlow)" />
  <circle class="ambient-orb" cx="120" cy="200" r="120" fill="#a855f7" opacity="0.08" filter="url(#neonGlow)" />

  <!-- 4. STATIC BORDER BASE -->
  <rect x="4" y="4" width="842" height="252" rx="18" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- 5. ⚡ ANIMATED GLOWING NEON BORDER OUTLINES ⚡ -->
  <!-- Cyan Moving Laser Outline -->
  <rect class="animated-card-border-cyan" x="4" y="4" width="842" height="252" rx="18" fill="none" stroke="url(#cyanGlowGrad)" stroke-width="3" filter="url(#neonGlow)" />
  <!-- Magenta/Purple Counter-Moving Laser Outline -->
  <rect class="animated-card-border-purple" x="4" y="4" width="842" height="252" rx="18" fill="none" stroke="url(#purpleGlowGrad)" stroke-width="2.5" filter="url(#neonGlow)" />

  <!-- 6. TOP BAR: Live Status Badge & Location -->
  <!-- Status Badge Background -->
  <rect x="36" y="26" width="280" height="30" rx="15" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
  
  <!-- Radar Live Pulsing Dot -->
  <circle cx="52" cy="41" r="4" fill="#10b981" />
  <circle class="radar-ring" cx="52" cy="41" r="4" fill="none" stroke="#10b981" stroke-width="1.5" />

  <text x="66" y="46" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.6">
    OPEN TO ROLES &amp; RESEARCH (ECE 2026)
  </text>

  <!-- Location Text on Right -->
  <text x="814" y="46" text-anchor="end" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
    📍 Kolkata, WB, India • MAKAUT University
  </text>

  <!-- 7. CENTER IDENTITY: Full Name & Subtitle -->
  <g transform="translate(36, 112)">
    <!-- Full Name with Gradient -->
    <text x="0" y="0" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Ratnesh Kumar Singh
    </text>

    <!-- Verified Badge Icon -->
    <g transform="translate(365, -24)" filter="url(#subtleGlow)">
      <circle cx="12" cy="12" r="10" fill="#00f2fe" />
      <path d="M7 12l3.5 3.5 6.5-6.5" fill="none" stroke="#080c14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Subtitle Line -->
    <text x="0" y="30" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">
      <tspan fill="#38bdf8" font-weight="700">Electronics &amp; Communication Engineer</tspan>
      <tspan fill="#64748b"> | </tspan>
      <tspan fill="#cbd5e1">AI Automation &amp; Agents</tspan>
      <tspan fill="#64748b"> | </tspan>
      <tspan fill="#cbd5e1">Networking &amp; IT Infrastructure</tspan>
    </text>
  </g>

  <!-- 8. BOTTOM ROW: Domain Highlights (4 Glowing Pills) -->
  <!-- Pill 1: V2X Smart Antenna -->
  <g transform="translate(36, 192)">
    <rect x="0" y="0" width="180" height="34" rx="8" fill="url(#pillGradCyan)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" />
    <text x="14" y="21" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
      🛰️ V2X Smart Antenna
    </text>
  </g>

  <!-- Pill 2: AI Agents & n8n -->
  <g transform="translate(228, 192)">
    <rect x="0" y="0" width="170" height="34" rx="8" fill="url(#pillGradPurple)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1" />
    <text x="14" y="21" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
      🤖 LLM Agents &amp; n8n
    </text>
  </g>

  <!-- Pill 3: IoT & Telemetry -->
  <g transform="translate(410, 192)">
    <rect x="0" y="0" width="195" height="34" rx="8" fill="url(#pillGradAmber)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1" />
    <text x="14" y="21" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
      ⚡ IoT &amp; Hardware Telemetry
    </text>
  </g>

  <!-- Pill 4: Figma UI/UX -->
  <g transform="translate(617, 192)">
    <rect x="0" y="0" width="197" height="34" rx="8" fill="url(#pillGradRose)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1" />
    <text x="14" y="21" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
      🎨 Figma UI/UX &amp; Web
    </text>
  </g>
</svg>
