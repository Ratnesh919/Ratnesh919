<svg fill="none" viewBox="0 0 850 260" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        }

        .header-container {
          width: 850px;
          height: 260px;
          background: linear-gradient(135deg, #090d16 0%, #0d1322 50%, #080c14 100%);
          border-radius: 16px;
          border: 1px solid rgba(0, 242, 254, 0.25);
          position: relative;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          padding: 28px 36px;
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 242, 254, 0.15);
        }

        /* Animated background glow orbs */
        .glow-orb-1 {
          position: absolute;
          width: 320px;
          height: 320px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(0, 242, 254, 0.18) 0%, rgba(0, 242, 254, 0) 70%);
          top: -100px;
          right: -50px;
          animation: floatOrb 8s ease-in-out infinite alternate;
        }

        .glow-orb-2 {
          position: absolute;
          width: 280px;
          height: 280px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(121, 40, 202, 0.22) 0%, rgba(121, 40, 202, 0) 70%);
          bottom: -80px;
          left: -40px;
          animation: floatOrb2 10s ease-in-out infinite alternate;
        }

        @keyframes floatOrb {
          0% { transform: translate(0, 0) scale(1); }
          100% { transform: translate(-40px, 30px) scale(1.15); }
        }

        @keyframes floatOrb2 {
          0% { transform: translate(0, 0) scale(1); }
          100% { transform: translate(35px, -25px) scale(1.2); }
        }

        /* Top status bar */
        .top-row {
          display: flex;
          justify-content: space-between;
          align-items: center;
          position: relative;
          z-index: 2;
        }

        .status-badge {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 6px 14px;
          background: rgba(16, 185, 129, 0.12);
          border: 1px solid rgba(16, 185, 129, 0.35);
          border-radius: 20px;
          color: #34d399;
          font-size: 12px;
          font-weight: 600;
          letter-spacing: 0.5px;
        }

        .pulse-dot {
          width: 8px;
          height: 8px;
          background-color: #10b981;
          border-radius: 50%;
          box-shadow: 0 0 10px #10b981;
          animation: pulse 2s infinite;
        }

        @keyframes pulse {
          0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
          70% { transform: scale(1.2); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
          100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .degree-badge {
          font-size: 12px;
          color: #94a3b8;
          font-weight: 500;
          display: flex;
          align-items: center;
          gap: 6px;
        }

        /* Main title and identity */
        .main-content {
          position: relative;
          z-index: 2;
          margin-top: 4px;
        }

        .name-title {
          font-size: 34px;
          font-weight: 800;
          letter-spacing: -0.5px;
          background: linear-gradient(90deg, #ffffff 0%, #00f2fe 50%, #4facfe 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          margin-bottom: 6px;
          display: flex;
          align-items: center;
          gap: 10px;
        }

        .verified-icon {
          width: 22px;
          height: 22px;
          fill: #00f2fe;
        }

        .subtitle {
          font-size: 15px;
          font-weight: 500;
          color: #94a3b8;
          display: flex;
          align-items: center;
          gap: 8px;
          line-height: 1.4;
        }

        .highlight-text {
          color: #38bdf8;
          font-weight: 600;
        }

        /* Bottom skill pills */
        .bottom-row {
          display: flex;
          gap: 10px;
          flex-wrap: wrap;
          position: relative;
          z-index: 2;
        }

        .pill {
          background: rgba(15, 23, 42, 0.7);
          border: 1px solid rgba(255, 255, 255, 0.1);
          padding: 6px 14px;
          border-radius: 8px;
          font-size: 12px;
          font-weight: 600;
          color: #cbd5e1;
          display: flex;
          align-items: center;
          gap: 6px;
          backdrop-filter: blur(8px);
          transition: all 0.3s ease;
        }

        .pill-cyan { border-color: rgba(0, 242, 254, 0.3); color: #67e8f9; }
        .pill-purple { border-color: rgba(168, 85, 247, 0.3); color: #c084fc; }
        .pill-amber { border-color: rgba(245, 158, 11, 0.3); color: #fcd34d; }
        .pill-rose { border-color: rgba(244, 63, 94, 0.3); color: #fda4af; }

        /* Tech grid lines overlay */
        .grid-overlay {
          position: absolute;
          inset: 0;
          background-image: linear-gradient(rgba(0, 242, 254, 0.04) 1px, transparent 1px),
                            linear-gradient(90deg, rgba(0, 242, 254, 0.04) 1px, transparent 1px);
          background-size: 28px 28px;
          opacity: 0.8;
          z-index: 1;
        }
      </style>

      <div class="header-container">
        <div class="grid-overlay"></div>
        <div class="glow-orb-1"></div>
        <div class="glow-orb-2"></div>

        <!-- Top Status Row -->
        <div class="top-row">
          <div class="status-badge">
            <span class="pulse-dot"></span>
            OPEN TO ROLES &amp; RESEARCH (ECE 2026)
          </div>
          <div class="degree-badge">
            📍 Kolkata, WB, India • MAKAUT University
          </div>
        </div>

        <!-- Center Identity -->
        <div class="main-content">
          <h1 class="name-title">
            Ratnesh Kumar Singh
            <svg class="verified-icon" viewBox="0 0 24 24">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
          </h1>
          <p class="subtitle">
            <span class="highlight-text">Electronics &amp; Communication Engineer</span> 
            • AI Automation &amp; Agents • Networking &amp; IT Infrastructure
          </p>
        </div>

        <!-- Bottom Domain Highlights -->
        <div class="bottom-row">
          <div class="pill pill-cyan">🛰️ V2X Smart Antenna</div>
          <div class="pill pill-purple">🤖 LLM Agents &amp; n8n</div>
          <div class="pill pill-amber">⚡ IoT &amp; Embedded Telemetry</div>
          <div class="pill pill-rose">🎨 Figma UI/UX Design</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
